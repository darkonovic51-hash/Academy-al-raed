<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ملف اللاعب | أكاديمية الرائد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--green:#1B5E3A;--green-2:#2E9E5B;--black:#0A0A0A;--gold:#C9A227;--bg:#F4F6F5;--border:#E3E8E5;--text:#141614;--text-2:#5C665F;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);}
.num-font{font-family:'Barlow Condensed',sans-serif;}
.container{max-width:1000px;margin:0 auto;padding:0 20px;}
a{text-decoration:none;color:inherit;}

.topbar{background:var(--black);padding:16px 0;}
.topbar .container{display:flex;justify-content:space-between;align-items:center;}
.topbar .brand{color:#fff;font-weight:800;display:flex;align-items:center;gap:10px;}
.topbar .brand i{color:var(--green-2);}
.topbar a.back{color:rgba(255,255,255,0.7);font-size:.85rem;font-weight:600;}

.player-hero{background:linear-gradient(160deg,var(--black),#0f2818);padding:60px 0 90px;position:relative;}
.player-header{display:flex;align-items:center;gap:40px;color:#fff;}
.player-photo{width:180px;height:180px;border-radius:20px;overflow:hidden;border:4px solid var(--green-2);box-shadow:0 20px 50px rgba(0,0,0,0.4);flex-shrink:0;background:var(--green);display:flex;align-items:center;justify-content:center;}
.player-photo img{width:100%;height:100%;object-fit:cover;}
.player-photo i{font-size:4rem;color:rgba(255,255,255,0.3);}
.player-jersey{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;color:var(--gold);}
.player-name{font-size:2.4rem;font-weight:900;line-height:1.15;margin:6px 0 10px;}
.player-meta{display:flex;gap:14px;flex-wrap:wrap;}
.player-meta span{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);padding:8px 18px;border-radius:8px;font-size:.85rem;font-weight:700;}

.content-wrap{padding:60px 0;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;margin-top:-70px;position:relative;z-index:2;}
.stat-box{background:#fff;border-radius:16px;padding:26px;text-align:center;box-shadow:0 20px 50px rgba(10,10,10,0.1);border:1px solid var(--border);}
.stat-box .n{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:800;color:var(--green);}
.stat-box .l{font-size:.8rem;color:var(--text-2);font-weight:700;}
.bio-panel{background:#fff;border-radius:16px;padding:32px;border:1px solid var(--border);box-shadow:0 10px 30px rgba(10,10,10,0.05);}
.bio-panel h3{font-weight:800;margin-bottom:14px;color:var(--green);}
.bio-panel p{color:var(--text-2);line-height:2;}
.not-found{text-align:center;padding:100px 20px;}
.not-found i{font-size:3rem;color:var(--border);margin-bottom:16px;}
@media(max-width:768px){.player-header{flex-direction:column;text-align:center;} .stats-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="container">
    <div class="brand"><i class="fas fa-shield-halved"></i> أكاديمية الرائد</div>
    <a href="index.html" class="back"><i class="fas fa-arrow-right"></i> رجوع للصفحة الرئيسية</a>
  </div>
</div>

<div id="pageBody"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCV8V1ELmyirFP8hAYV6abC7nSJbVfEKd0",
  authDomain: "academy-raed-new.firebaseapp.com",
  projectId: "academy-raed-new",
  storageBucket: "academy-raed-new.firebasestorage.app",
  messagingSenderId: "408030922593",
  appId: "1:408030922593:web:190a2a671fca9cb297a720",
  measurementId: "G-8ZCCBF7HRK"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(window.location.search);
const playerId = params.get('id');
const body = document.getElementById('pageBody');

if(!playerId){
  body.innerHTML = `<div class="not-found"><i class="fas fa-user-slash"></i><h2>لم يتم تحديد لاعب</h2><p>الرجاء الوصول لهذه الصفحة عبر رابط لاعب صحيح.</p></div>`;
} else {
  db.ref('academy/players/'+playerId).once('value').then(snap => {
    const p = snap.val();
    if(!p){
      body.innerHTML = `<div class="not-found"><i class="fas fa-user-slash"></i><h2>اللاعب غير موجود</h2></div>`;
      return;
    }
    document.title = `${p.firstName} ${p.lastName} | أكاديمية الرائد`;
    const age = p.birthDate ? Math.floor((new Date() - new Date(p.birthDate))/(365.25*24*3600*1000)) : '-';
    body.innerHTML = `
      <section class="player-hero">
        <div class="container player-header">
          <div class="player-photo">${p.photo ? `<img src="${p.photo}" />` : `<i class="fas fa-user"></i>`}</div>
          <div>
            <div class="player-jersey num-font">#${p.jersey || '-'}</div>
            <div class="player-name">${p.firstName} ${p.lastName}</div>
            <div class="player-meta">
              <span><i class="fas fa-futbol"></i> ${p.position || 'غير محدد'}</span>
              <span><i class="fas fa-layer-group"></i> فئة ${p.category}</span>
              <span><i class="fas fa-birthday-cake"></i> ${age} سنة</span>
            </div>
          </div>
        </div>
      </section>
      <div class="container content-wrap">
        <div class="stats-grid">
          <div class="stat-box"><div class="n num-font">${p.goals||0}</div><div class="l">⚽ الأهداف</div></div>
          <div class="stat-box"><div class="n num-font">${p.assists||0}</div><div class="l">🎯 تمريرات حاسمة</div></div>
          <div class="stat-box"><div class="n num-font">${p.matches||0}</div><div class="l">📊 المباريات</div></div>
        </div>
        <div class="bio-panel">
          <h3><i class="fas fa-quote-right"></i> نبذة عن اللاعب</h3>
          <p>${p.bio || 'لا توجد نبذة متاحة حالياً عن هذا اللاعب.'}</p>
        </div>
      </div>`;
  });
}
</script>
</body>
</html>
